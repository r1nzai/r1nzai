<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <title>Rinzai (Parameswar Kishan)</title>
    <meta
      name="description"
      content="Rinzai (Parameswar Kishan): full-stack developer in Kerala, India. Builder of Zen, Sora and Streamemo."
    />
    <!-- Zen's themeScript: applies the remembered light/dark choice before first paint. -->
    <script>
      try {
        var t = localStorage.getItem("theme"),
          r = document.documentElement;
        if (t === "light" || t === "dark") {
          r.classList.remove("light", "dark");
          r.classList.add(t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
