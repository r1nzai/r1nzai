<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <title>Rinzai (Parameswar Kishan)</title>
    <meta
      name="description"
      content="Rinzai (Parameswar Kishan): full-stack developer in Kerala, India. Builder of Zen, Sora and Streamemo."
    />
    <meta name="author" content="Parameswar Kishan" />
    <link rel="canonical" href="https://rinzai.dev/" />
    <!-- Zen's dark --background, oklch(0.155 0.014 295): dark is its default theme. -->
    <meta name="theme-color" content="#0d0b12" />

    <!-- Link previews (Open Graph is also read by LinkedIn, Discord and Slack; X falls back to it). -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Rinzai" />
    <meta property="og:url" content="https://rinzai.dev/" />
    <meta property="og:title" content="Rinzai (Parameswar Kishan)" />
    <meta
      property="og:description"
      content="Full-stack developer in Kerala, India. Builder of Zen, Sora and Streamemo."
    />
    <meta property="og:image" content="https://rinzai.dev/fern.webp" />
    <meta property="og:image:width" content="336" />
    <meta property="og:image:height" content="336" />
    <meta property="og:image:alt" content="Fern, Rinzai's avatar" />
    <meta property="profile:first_name" content="Parameswar" />
    <meta property="profile:last_name" content="Kishan" />
    <meta property="profile:username" content="r1nzai" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@R1nzai" />
    <meta name="twitter:creator" content="@R1nzai" />

    <!-- Who this is, for search engines: ties the name, alias and profiles together. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Parameswar Kishan",
        "alternateName": "Rinzai",
        "url": "https://rinzai.dev/",
        "image": "https://rinzai.dev/fern.webp",
        "email": "mailto:me@rinzai.dev",
        "jobTitle": "Prime Technology Senior Analyst",
        "worksFor": { "@type": "Organization", "name": "Veritas Prime Labs" },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "PRS College of Engineering and Technology"
        },
        "address": { "@type": "PostalAddress", "addressRegion": "Kerala", "addressCountry": "IN" },
        "knowsAbout": ["TypeScript", "React", "Node.js", "Rust", "Tailwind CSS", "PostgreSQL"],
        "sameAs": [
          "https://github.com/r1nzai",
          "https://www.linkedin.com/in/parameswar-kishan/",
          "https://x.com/R1nzai",
          "https://www.instagram.com/r1nzai/",
          "https://steamcommunity.com/id/Rinzai/"
        ]
      }
    </script>
    <!-- Zen's themeScript: applies the remembered light/dark choice before first paint. -->
    <script>
      try {
        var t = localStorage.getItem("theme"),
          r = document.documentElement;
        if (t === "light" || t === "dark") {
          r.classList.remove("light", "dark");
          r.classList.add(t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
